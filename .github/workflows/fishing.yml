name: Auto fishing

on:
  workflow_dispatch:
    inputs:
      username:
        description: Username bot
        required: true
        default: BOTMARKET
      password:
        description: Password bot
        required: true

concurrency:
  group: auto-fishing
  cancel-in-progress: true

jobs:
  fish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sembunyikan password di log
        env:
          MC_PASS: ${{ inputs.password }}
        run: echo "::add-mask::$MC_PASS"
      - name: Install dependency
        run: npm install --no-audit --no-fund
      - name: Jalankan bot
        env:
          MC_USER: ${{ inputs.username }}
          MC_PASS: ${{ inputs.password }}
        run: node fishing.js
